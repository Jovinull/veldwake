[workspace]
members = [
    "apps/client",
    "crates/character",
    "crates/combat",
    "crates/foundation",
    "crates/procedural",
    "crates/streaming",
    "crates/voxel",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
